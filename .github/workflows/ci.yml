name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # AGENTS.md가 선언한 규약을 빌드가 강제한다 — 다관점 리뷰에서 "규약은 지켜지고 있지만
      # 강제 장치가 없는 경계에서만 무너졌다"는 것이 드러나 추가했다(모듈 경계·Lombok·이모지·
      # 기종 분기 기준선·읽기 전용 게이트). 테스트보다 먼저 돌려 빠르게 실패시킨다.
      - name: Convention checks
        run: ./scripts/check-conventions.sh
      # 브라우저 바이너리는 Playwright 버전에만 매여 있다 — 커밋마다 다시 받을 이유가 없다(#144, 매 실행 58초).
      # 키에 버전을 넣어, 버전을 올리면 캐시가 자동으로 갈린다
      - name: Playwright 버전 확인
        id: pw
        run: |
          v=$(grep -oE "playwright:[0-9]+\.[0-9]+\.[0-9]+" build.gradle | head -1 | sed "s/playwright://")
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Playwright $v"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # 역할별 화면 E2E(PersonaUiE2ETest)용 브라우저 — 136절 화면 결함은 사람이 눌러서야 나왔다. CI가 같은 화면을 실제 브라우저로 누른다.
      # 캐시가 맞아도 --with-deps 의 OS 패키지는 러너에 남지 않으므로 그 설치는 건너뛰지 않는다
      - name: Install Playwright Chromium
        run: ./gradlew playwrightInstall
      - name: Test
        env:
          DBTOWER_E2E: "1"
        run: ./gradlew test
      # E2E가 조용히 건너뛰어지면(환경변수 누락 등) 테스트 단계는 초록이다 — 결과 파일로 실제로 돌았는지 확인해 건너뜀이면 실패시킨다
      - name: E2E actually ran
        run: |
          f=build/test-results/test/TEST-io.dbtower.e2e.PersonaUiE2ETest.xml
          grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          grep -q 'skipped="0"' "$f"
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
