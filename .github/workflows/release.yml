name: Release

# v1.2.3 형태의 태그를 push 하면 이미지를 빌드해 GHCR 에 게시하고 GitHub Release를 만든다.
#   git tag -a v1.3.1 -m "DBTower v1.3.1" && git push origin v1.3.1
# 수동 실행은 이미 존재하는 SemVer 태그를 다시 게시할 때만 쓴다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '다시 게시할 기존 태그(vX.Y.Z)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release 생성에 필요
      packages: write   # GHCR push 에 필요
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # 이미지에 넣는 jar 는 Dockerfile 안에서 빌드되지만, 게시 전 테스트로 게이트한다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Convention checks
        run: ./scripts/check-conventions.sh
      - name: Install Playwright Chromium
        run: ./gradlew playwrightInstall
      - name: Test (게시 전 게이트)
        env:
          DBTOWER_E2E: "1"
        run: ./gradlew test
      - name: E2E actually ran
        run: |
          f=build/test-results/test/TEST-io.dbtower.e2e.PersonaUiE2ETest.xml
          grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          grep -q 'skipped="0"' "$f"

      # arm64 크로스 빌드용 QEMU (ARM 서버·Apple Silicon 사용자가 에뮬레이션 없이 돌게)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # gha 캐시(cache-to type=gha)는 기본 docker 드라이버가 지원하지 않는다 —
      # docker-container 드라이버를 쓰는 buildx 셋업이 필요 (첫 릴리스에서 실측한 실패)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그(v1.0.0)에서 1.0.0, 1.0, 1, latest 태그를 자동 생성
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # jar는 플랫폼 무관(Java)이지만 빌드 스테이지가 플랫폼별로 돌아 arm64는 QEMU 에뮬레이션으로
          # 느리다 — 빌드 시간 ~2배를 받아들이고 단순함을 유지한다(러너에서 jar 선빌드로 최적화 가능하나
          # 파이프라인 복잡도 증가라 보류)
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/dbtower-release-notes.md
          test -s /tmp/dbtower-release-notes.md
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "DBTower $RELEASE_TAG" --notes-file /tmp/dbtower-release-notes.md
