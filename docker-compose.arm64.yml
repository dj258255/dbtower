# Apple Silicon의 Azure SQL Edge 호환성을 조사하는 덮어쓰기 (VERIFICATION 131·163·164절).
#
# 기본 docker-compose.yml의 mssql은 amd64 전용 SQL Server 2022 이미지라 Rosetta가 없는 VM(Colima vz 등)에서는 기동 즉시 죽는다.
# 이 파일은 같은 서비스 이름·포트로 arm64 Azure SQL Edge를 시도한다. SQL Edge는 SQL Server 엔진(T-SQL·트랜잭션 DDL·SHOWPLAN)을
# 공유하지만 2025-09-30에 지원이 끝난 제품이고 SQL Agent·CLR 등이 없다. 현재 M2 Pro·macOS 26.3.1·Colima 0.8.1에서는
# `S_SbtUnimplementedInstruction` SIGABRT로 종료되므로 정상 기동 경로로 안내하지 않는다. 실제 SQL Server 검증은 아래 Rosetta 경로를 쓴다.
#
#   docker compose -f docker-compose.yml -f docker-compose.arm64.yml up -d mssql
#
# Mac에 Rosetta가 있으면 이 덮어쓰기 없이 실제 SQL Server 2022를 띄울 수 있다(VERIFICATION 132절). 기존 VM은 그대로 두고
# Rosetta를 켠 Colima 프로필을 하나 더 만든다. 호스트 포트가 겹치지 않게 고른다(11434는 Ollama가 흔히 쓴다).
#
#   colima start mssql2022 --vm-type vz --vz-rosetta --cpu 4 --memory 6
#   MSSQL_SA_PASSWORD='...' docker --context colima-mssql2022 run -d --name dbtower-mssql2022 --platform linux/amd64 \
#     -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD -p 14330:1433 mcr.microsoft.com/mssql/server:2022-latest
#   DBTOWER_CONSOLE_IT=1 DBTOWER_MSSQL_IT=1 DBTOWER_MSSQL_PORT=14330 ./gradlew test --tests '*ChangeExecutionIT'
services:
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    platform: linux/arm64
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "Dbtower1234!"
