# DBTower 셀프호스트 (앱 + 전용 메타 DB) — "5분 만에 내 DB 붙이기"
#
# 이 compose 는 관리 "도구"만 띄운다. 관리 "대상" DB(MySQL/PG/... )는 사용자가 이미 가진
# 것을 웹 UI(또는 API)에서 등록한다 — Grafana/PMM 처럼 셀프호스트로 자기 인프라에 붙이는 모델.
# (5기종 데모 대상까지 한 번에 띄우려면 docker-compose.yml 을 함께 쓰는 놀이터 구성을 README 참고.)
#
# 시작:  cp .env.example .env  &&  편집  &&  docker compose -f docker-compose.app.yml up -d
services:
  dbtower:
    # 게시 후엔 이미지 pull 로 충분. 최초/오프라인은 로컬 빌드(--build).
    image: ghcr.io/dj258255/dbtower:${DBTOWER_TAG:-latest}
    build:
      context: .
    container_name: dbtower-app
    depends_on:
      meta-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 메타 DB(플랫폼 자체 저장소) — 대상 DB 가 아니라 DBTower 의 상태 저장소
      DBTOWER_DB_URL: jdbc:postgresql://meta-db:5432/dbtower
      DBTOWER_DB_USERNAME: dbtower
      DBTOWER_DB_PASSWORD: ${DBTOWER_DB_PASSWORD:?meta DB 비밀번호를 .env 에 설정하세요}
      # 관리자 초기 비밀번호(미설정 시 앱이 랜덤 생성 후 로그로 1회 안내)
      DBTOWER_ADMIN_PASSWORD: ${DBTOWER_ADMIN_PASSWORD:-}
      # 역할별 계정 비밀번호(선택) — 비운 역할은 계정을 만들지 않는다
      DBTOWER_VIEWER_PASSWORD: ${DBTOWER_VIEWER_PASSWORD:-}
      DBTOWER_REQUESTER_PASSWORD: ${DBTOWER_REQUESTER_PASSWORD:-}
      DBTOWER_APPROVER_PASSWORD: ${DBTOWER_APPROVER_PASSWORD:-}
      DBTOWER_OPERATOR_PASSWORD: ${DBTOWER_OPERATOR_PASSWORD:-}
      # 기계·자동화용 Bearer API 토큰(선택). IaC 자동 등록(k8s register-job 등)을 쓰려면 필수 —
      # register 쪽 DBTOWER_TOKEN과 같아야 한다. 비우면 Bearer 인증 비활성(사람 세션 로그인만).
      DBTOWER_API_TOKEN: ${DBTOWER_API_TOKEN:-}
      # 리버스 프록시(Caddy/nginx)로 HTTPS 종단 시 true — 세션·CSRF 쿠키에 Secure 플래그.
      # 프록시 뒤 배포의 [권장] 하드닝. compose가 이 env를 넘겨야 앱이 실제로 켠다(안 넘기면 무효).
      DBTOWER_COOKIE_SECURE: ${DBTOWER_COOKIE_SECURE:-false}
      # 외부 접근 주소(프록시 뒤면 그 공개 URL, 예: https://dbtower.example.com). MCP OAuth의
      # resource_metadata·리다이렉트 절대 URL 기준. 미설정 시 http://localhost:포트로 가정.
      DBTOWER_BASE_URL: ${DBTOWER_BASE_URL:-}
      # 등록 대상 DB 비밀번호를 저장 시 암호화(AES-256-GCM). base64 32바이트. [필수] — 미설정 시
      # docker 프로필이 fail-closed로 기동 거부(평문 저장 방지, CWE-312). 생성: openssl rand -base64 32
      DBTOWER_ENCRYPTION_KEY: ${DBTOWER_ENCRYPTION_KEY:?암호화 키가 필요합니다 — .env에 DBTOWER_ENCRYPTION_KEY 설정 (openssl rand -base64 32)}
      # AI 1차 분석용 Anthropic API 키(선택). 미설정 시 AI 분석 비활성(규칙 기반 지적까지).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 이상 감지 알림 웹훅(선택). 미설정 시 알림 비활성.
      DBTOWER_WEBHOOK_URL: ${DBTOWER_WEBHOOK_URL:-}
      # 백업 원격 보관(선택, 3-2-1 오프사이트) — S3 호환(AWS S3·MinIO·R2).
      # enabled=true + 자격증명을 주면 성공 백업이 자동 업로드된다(실패해도 로컬 백업은 유효).
      DBTOWER_BACKUP_REMOTE_ENABLED: ${DBTOWER_BACKUP_REMOTE_ENABLED:-false}
      DBTOWER_BACKUP_REMOTE_ENDPOINT: ${DBTOWER_BACKUP_REMOTE_ENDPOINT:-}
      DBTOWER_BACKUP_REMOTE_BUCKET: ${DBTOWER_BACKUP_REMOTE_BUCKET:-dbtower-backups}
      DBTOWER_S3_ACCESS_KEY: ${DBTOWER_S3_ACCESS_KEY:-}
      DBTOWER_S3_SECRET_KEY: ${DBTOWER_S3_SECRET_KEY:-}
      # 백업 운영 knob(선택) — 보존일수/산출물 암호화 키(주면 백업 파일을 이 키로 암호화)/복원검증 격리.
      # typed(int/boolean)는 빈 문자열을 넘기면 기동이 깨지므로 앱 기본값을 fallback으로 둔다
      # (:- 는 .env가 비어 있어도 fallback을 쓴다). 문자열인 암호화 키만 빈 값 허용.
      DBTOWER_BACKUP_RETENTION_DAYS: ${DBTOWER_BACKUP_RETENTION_DAYS:-14}
      DBTOWER_BACKUP_ENCRYPTION_KEY: ${DBTOWER_BACKUP_ENCRYPTION_KEY:-}
      DBTOWER_VERIFY_ISOLATED: ${DBTOWER_VERIFY_ISOLATED:-false}
      # 그 밖의 통합(선택)은 이 compose에 기본 나열하지 않았다 — 필요 시 여기 environment에 추가한다:
      #   ChatOps(Discord/Slack): DBTOWER_DISCORD_*, DBTOWER_SLACK_*  (docs/design/DESIGN.md)
      #   외부 시크릿(Vault): DBTOWER_VAULT_URL/DBTOWER_VAULT_TOKEN
      #   디스크 예측 소스(외부 Prometheus/CloudWatch): DBTOWER_PROMETHEUS_URL 등
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    ports:
      - "${DBTOWER_PORT:-8080}:8080"
    volumes:
      # 백업 산출물 영속(application-docker.yml 의 dbtower.backup.dir=/app/backups)
      - dbtower-backups:/app/backups
    restart: unless-stopped

  meta-db:
    image: postgres:16
    container_name: dbtower-meta-db
    environment:
      POSTGRES_USER: dbtower
      POSTGRES_PASSWORD: ${DBTOWER_DB_PASSWORD:?meta DB 비밀번호를 .env 에 설정하세요}
      POSTGRES_DB: dbtower
    volumes:
      - dbtower-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbtower -d dbtower"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  dbtower-meta-data:
  dbtower-backups:
