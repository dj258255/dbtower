# 테스트 전용 설정 — 실 DB 없이(CI 포함) 컨텍스트가 뜨도록 인메모리 H2를 쓴다.
# H2는 PostgreSQL 호환 모드 — 플랫폼 저장소가 PostgreSQL 문법을 전제하기 때문.
spring:
  # 프로필을 명시한다 — SecretCipher가 "프로필 미설정"도 fail-closed로 보게 바뀌었기 때문.
  # 예전에는 prod/docker만 fail-closed라 그 밖의 이름(production·k8s·internal…)은 전부 평문 폴백이었다.
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:dbtower;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    # 테스트에서는 Flyway를 끈다 — 마이그레이션(db/migration)은 PostgreSQL 문법 전제라
    # H2에서 돌리면 방언 차이를 좇는 이중 관리가 된다. H2는 스키마 검증 대상이 아니라
    # 컨텍스트 부팅용이므로, 스키마는 종전대로 Hibernate create-drop이 만든다.
    # 실제 스키마 검증은 본 설정의 ddl-auto=validate가 PostgreSQL 기동 시점에 수행한다.
    enabled: false
  # SPRING_SESSION은 엔티티가 아니라 Flyway(V15) 소유라 H2 create-drop이 만들지 않는다.
  # @EnableJdbcHttpSession은 Boot의 initialize-schema를 우회하므로, 테스트에선 spring-session이
  # 제공하는 H2 스키마 스크립트를 sql.init으로 직접 주입한다(운영은 Flyway가 만든다).
  sql:
    init:
      mode: always
      schema-locations: classpath:org/springframework/session/jdbc/schema-h2.sql,classpath:schema-alert-cooldown-h2.sql,classpath:schema-collection-status-h2.sql
      # 인메모리 H2(DB_CLOSE_DELAY=-1)가 테스트 컨텍스트 간 공유돼 스크립트가 재실행되면
      # "already exists"가 난다 — 세션 테이블 생성은 멱등으로 취급(있으면 통과).
      continue-on-error: true

dbtower:
  # 토큰을 여기서 고정한다 — 값이 필요해서가 아니라 컨텍스트를 나누지 않기 위해서다(#144).
  # @SpringBootTest(properties = ...) 는 스프링 컨텍스트 캐시 키의 일부라, 이 한 줄 때문에
  # 열 개가 넘는 클래스가 저마다 컨텍스트를 새로 띄웠다(한 번에 약 18초).
  # 미설정이면 ApiTokenProvider 가 임의 토큰을 만들어 저장하므로, 고정값을 준다고 해서
  # 검증이 약해지지 않는다 — 토큰 인증을 실제로 보는 테스트는 그대로 이 값을 쓴다.
  security:
    api-token: test-api-token
    mcp-token: test-mcp-token
  snapshot:
    interval-ms: 3600000   # 테스트 중 폴러가 돌지 않게 사실상 정지
    retention-sweep-ms: 3600000
  regression:
    poll-ms: 3600000
  backup:
    poll-ms: 3600000
