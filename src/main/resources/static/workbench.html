<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>워크벤치 - DBTower</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  // 워크벤치는 대시보드와 한 페이지의 모드가 됐다(149절). 북마크·로그인 뒤 다시 여는 요청(?ticket=3)·예전 링크의 쿼리를 그대로 옮긴다
  const q = location.search.replace(/^\?/, "");
  location.replace("/?mode=workbench" + (q ? "&" + q : "") + location.hash);
</script>
</head>
<body>
<p><a href="/?mode=workbench">워크벤치로 이동</a></p>
</body>
</html>
