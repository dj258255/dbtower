<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBTower 로그인</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<main class="login">
  <img class="login-logo" src="favicon.svg" alt="" width="56" height="56">
  <h1 class="login-title">DBTower</h1>

  <form method="post" action="/login" class="login-form">
    <!-- 아이디·비밀번호를 한 묶음으로 둔다(iOS 그룹형). 라벨은 입력 뒤에 둬야 :placeholder-shown으로 띄울 수 있다 -->
    <div class="login-group">
      <div class="login-field">
        <input type="text" id="username" name="username" autocomplete="username" autofocus required placeholder=" ">
        <label for="username">아이디</label>
      </div>
      <div class="login-field">
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder=" ">
        <label for="password">비밀번호</label>
        <button type="submit" class="login-submit" aria-label="로그인">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <path d="M4 10h11M11 5.5 15.5 10 11 14.5" fill="none" stroke="currentColor" stroke-width="1.9"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
    <input type="hidden" name="_csrf" id="csrf-field">
  </form>

  <p id="login-error" class="login-error" role="alert" hidden>아이디 또는 비밀번호가 올바르지 않습니다</p>

  <!-- 입력 바로 아래 상자로 둔다 — 로그인에 막힌 처음 사용자가 시선을 옮기지 않고 읽는다. 오류가 있으면 오류 다음에 온다.
       환경변수는 비밀번호를 정하는 곳이고, 정하지 않으면 첫 기동 때 로그에 한 번 찍힌다(PlatformUserService) -->
  <p class="login-note">
    admin 비밀번호는 <code>DBTOWER_ADMIN_PASSWORD</code> 값이고, 지정하지 않았다면 첫 기동 때 앱 로그에 한 번 출력됩니다.
  </p>
</main>

<script>
// CSRF 쿠키(XSRF-TOKEN)를 폼 히든 필드로 — 서버가 GET 응답에서 심어준 값을 되돌려주는 표준 패턴
const token = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
if (token) document.getElementById("csrf-field").value = decodeURIComponent(token[1]);
const params = new URLSearchParams(location.search);
if (params.has("error")) {
  const box = document.getElementById("login-error");
  if (params.get("error") === "locked") {
    // retryAfter는 숫자만 신뢰 — Number로 강제해 XSS 여지를 없앤다(문자열 삽입 금지)
    const secs = Math.max(0, parseInt(params.get("retryAfter"), 10) || 0);
    const mins = Math.ceil(secs / 60);
    box.textContent = "로그인 시도가 너무 많습니다. 약 " + mins + "분 뒤 다시 시도하세요";
  }
  box.hidden = false;
}
</script>
</body>
</html>
