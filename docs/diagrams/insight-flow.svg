<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" width="1180" height="500" role="img" aria-label="DBTower 발견에서 실행까지">
<title>DBTower 발견에서 실행까지</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="1180" height="500" fill="#ffffff"/>
<text x="40" y="40" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">발견에서 실행까지</text>
<text x="40" y="62" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">AI 는 근거를 모아 1차 소견까지. 승인은 사람이, 실행의 안전은 불변식이 맡는다</text>
<rect x="40" y="84" width="1100" height="148" rx="12" fill="#fafafa" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
<text x="56" y="102" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="start" dominant-baseline="middle">관측에서 변경 요청까지 — 여기까지는 아무것도 바꾸지 않는다</text>
<rect x="60" y="110" width="250" height="92" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="74" y="128" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle">1</text>
<text x="185" y="154.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">발견</text>
<text x="185" y="169.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">헬스 · Top Query · 경보</text>
<rect x="330" y="110" width="250" height="92" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="344" y="128" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle">2</text>
<text x="455" y="154.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">비교</text>
<text x="455" y="169.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">두 구간의 누적 카운터 차분</text>
<rect x="600" y="110" width="250" height="92" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="614" y="128" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle">3</text>
<text x="725" y="147" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">결정론적 근거</text>
<text x="725" y="162" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">실행계획 · 스키마</text>
<text x="725" y="177" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">wait · 복제 상태</text>
<rect x="870" y="110" width="270" height="92" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="884" y="128" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#0a6aa8" text-anchor="start" dominant-baseline="middle">4</text>
<text x="1005" y="147" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0a6aa8" text-anchor="middle" dominant-baseline="middle">AI 1차 분석</text>
<text x="1005" y="162" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">읽기 도구만 고른다</text>
<text x="1005" y="177" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">판단 기준은 사람이 정한 문서</text>
<path d="M 310 156 H 330" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 580 156 H 600" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 850 156 H 870" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="280" width="1100" height="158" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1" stroke-dasharray="4 4"/>
<text x="56" y="298" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="start" dominant-baseline="middle">사람의 승인과 실행 계층의 검증 — 여기서만 바뀐다</text>
<rect x="60" y="306" width="250" height="92" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
<text x="74" y="324" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#b42335" text-anchor="start" dominant-baseline="middle">5</text>
<text x="185" y="350.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#b42335" text-anchor="middle" dominant-baseline="middle">변경 요청</text>
<text x="185" y="365.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">SQL · 이유 · 예상 영향</text>
<rect x="330" y="306" width="250" height="92" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
<text x="344" y="324" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#b42335" text-anchor="start" dominant-baseline="middle">6</text>
<text x="455" y="350.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#b42335" text-anchor="middle" dominant-baseline="middle">승인 (APPROVER)</text>
<text x="455" y="365.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">드라이런으로 먼저 본다</text>
<rect x="600" y="306" width="250" height="92" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
<text x="614" y="324" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#b42335" text-anchor="start" dominant-baseline="middle">7</text>
<text x="725" y="350.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#b42335" text-anchor="middle" dominant-baseline="middle">실행 (OPERATOR)</text>
<text x="725" y="365.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">승인자와 다른 사람</text>
<rect x="870" y="306" width="270" height="92" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
<text x="884" y="324" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#b42335" text-anchor="start" dominant-baseline="middle">8</text>
<text x="1005" y="350.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#b42335" text-anchor="middle" dominant-baseline="middle">결과 고정</text>
<text x="1005" y="365.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">감사 · 실행 기록 · 전후 비교</text>
<path d="M 310 352 H 330" fill="none" stroke="#b42335" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 580 352 H 600" fill="none" stroke="#b42335" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 850 352 H 870" fill="none" stroke="#b42335" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1005 202 V 250 H 185 V 306" fill="none" stroke="#b42335" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="459.8" y="241" width="270.4" height="18" rx="4" fill="#ffffff"/><text x="595" y="250" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" fill="#b42335" text-anchor="middle" dominant-baseline="middle">AI 가 낸 소견은 여기서 사람의 요청이 된다 — 모델이 실행하지 않는다</text>
<text x="40" y="458" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">실행의 안전은 문장 해석이 아니라 불변식에서 나온다 — 사본 행 수와 영향 행 수가 어긋나면 커밋하지 않는다.</text>
</svg>
