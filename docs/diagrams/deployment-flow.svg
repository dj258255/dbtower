<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="DBTower 배포 흐름">
<title>DBTower 배포 흐름</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
  </marker>
</defs>
<rect width="1180" height="560" fill="#ffffff"/>
<text x="40" y="40" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">변경이 합쳐지고 게시되고 도는 곳</text>
<text x="40" y="62" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">게이트는 붉게, 게시물은 파랗게 — 초록불이 무엇을 확인한 것인지가 드러나게</text>
<rect x="40" y="82" width="1100" height="130" rx="12" fill="#fafafa" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
<text x="56" y="100" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="start" dominant-baseline="middle">CI — Pull Request 마다. 합치기 전에 막는다</text>
<rect x="60" y="108" width="250" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="185" y="139.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">규약 검사</text>
<text x="185" y="154.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">모듈 경계 · 보안 기준선</text>
<rect x="330" y="108" width="250" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="455" y="139.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">전체 테스트</text>
<text x="455" y="154.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">Java 21 · 브라우저 E2E 포함</text>
<rect x="600" y="108" width="250" height="78" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
<text x="725" y="139.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#b42335" text-anchor="middle" dominant-baseline="middle">실제로 돌았는지</text>
<text x="725" y="154.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">JUnit XML 의 skipped = 0</text>
<rect x="870" y="108" width="270" height="78" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
<text x="1005" y="139.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#b42335" text-anchor="middle" dominant-baseline="middle">SQL Server 잡</text>
<text x="1005" y="154.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">기종 전용 경로를 따로 돈다</text>
<path d="M 310 147 H 330" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 580 147 H 600" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 850 147 H 870" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1140" y="208" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#b42335" text-anchor="end" dominant-baseline="middle">게이트를 못 받으면 테스트가 전부 건너뛰고도 초록불이 된다 — 그래서 돌았는지를 따로 단언한다</text>
<rect x="40" y="260" width="1100" height="130" rx="12" fill="#fafafa" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
<text x="56" y="278" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="start" dominant-baseline="middle">Release — vX.Y.Z 태그를 push 하면</text>
<rect x="60" y="286" width="250" height="78" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
<text x="185" y="317.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#b42335" text-anchor="middle" dominant-baseline="middle">같은 게이트 재실행</text>
<text x="185" y="332.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">규약 · 전체 테스트 · E2E</text>
<rect x="330" y="286" width="250" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="455" y="317.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">QEMU + Buildx</text>
<text x="455" y="332.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">arm64 는 에뮬레이션으로</text>
<rect x="600" y="286" width="250" height="78" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="725" y="317.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0a6aa8" text-anchor="middle" dominant-baseline="middle">GHCR 이미지</text>
<text x="725" y="332.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">amd64 + arm64 · SemVer</text>
<rect x="870" y="286" width="270" height="78" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="1005" y="317.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0a6aa8" text-anchor="middle" dominant-baseline="middle">GitHub Release</text>
<text x="1005" y="332.5" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">CHANGELOG 절을 그대로 싣는다</text>
<path d="M 310 325 H 330" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 580 325 H 600" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 850 325 H 870" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 600 222 V 260" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="448" width="540" height="84" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<text x="310" y="474" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">셀프호스트 런타임</text>
<text x="310" y="490" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">Docker Compose — DBTower + 전용 메타 DB(PostgreSQL · Flyway)</text>
<text x="310" y="506" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">관리 대상 DB 는 띄우지 않는다. 로그인 후 콘솔에서 등록한다</text>
<rect x="620" y="448" width="520" height="84" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="880" y="474" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="middle">관리 대상 프로비저닝</text>
<text x="880" y="490" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">Kubernetes · Terraform · Ansible — 앱 배포와 분리한다</text>
<text x="880" y="506" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">플랫폼은 대상을 만들지 않고 등록만 받는다</text>
<path d="M 310 390 V 448" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="269.195" y="381" width="81.61" height="18" rx="4" fill="#ffffff"/><text x="310" y="390" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">버전을 고정해 받는다</text>
</svg>
