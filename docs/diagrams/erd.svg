<text x="40" y="634" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">승인된 SQL 과 실행된 SQL 이 같다는 것을 표로 증명할 수 있어야 한다 — 이 사슬이 그것이다. 복원 검증에 성공한 백업은 대량 변경의 실행 전 조건이다.</text>
