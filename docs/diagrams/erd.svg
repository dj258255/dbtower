<rect width="1180" height="660" fill="#ffffff"/>
<text x="40" y="40" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="start" dominant-baseline="middle">데이터 모델</text>
<text x="40" y="62" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">인스턴스 하나에 세 갈래가 매달린다 — 관측, 변경의 증거, 백업</text>
