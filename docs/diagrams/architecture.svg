<text x="590" y="284" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">승인된 티켓만 실행 · 요청자와 승인자와 운영자가 다른 사람</text>
