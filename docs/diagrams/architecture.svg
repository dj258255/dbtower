<text x="965" y="608" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">PostgreSQL · Flyway</text>
<text x="965" y="624" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">대상 장애가 플랫폼을 죽이지 않게 분리한다</text>
<text x="40" y="674" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">조회는 읽기 전용 계정으로, 변경은 승인된 티켓만 — 이 둘이 이 플랫폼의 불변식이다.</text>
