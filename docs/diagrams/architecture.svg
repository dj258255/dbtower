<text x="190" y="146" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">역할 5종 · 로그인과 팀 범위</text>
<rect x="840" y="100" width="300" height="76" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
