<text x="990" y="300" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">모델이 낸 수치는 사실과 대조</text>
