<text x="990" y="146" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">조회와 요청만 · 실행 도구 없음</text>
