<text x="40" y="62" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start" dominant-baseline="middle">Java 21 · Spring Boot 4 · Spring Modulith 17 모듈 — 경계는 빌드가 검사한다</text>
<rect x="40" y="100" width="300" height="76" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
