<text x="364" y="619" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">JDBC</text>
