<text x="590" y="445" font-family="Pretendard, 'Apple SD Gothic Neo', -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">플랫폼 코드는 기종을 모른다 · 구현 선택은 팩토리 한 곳</text>
